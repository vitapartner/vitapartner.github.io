<head>

<title>VitaPartner · Seguimiento</title>
<link rel="icon" type="image/png" href="favicon-32.png">

<style>
:root{
  color-scheme:light;
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#17344A; --muted:#5A6B79; --line:#DCE3E9;
  --accent:#15603A; --accent-soft:#DEF0E4; --accent-ink:#FFFFFF; --ok:#1F8F4B; --bad:#C0392F; --bad-soft:#F8DEDA;
  --display:"Outfit","Segoe UI",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --wm-l:block; --wm-d:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0D1620; --surface:#15212C; --surface-2:#1B2935; --ink:#E6EDF2; --muted:#93A3B0; --line:#2A3A48;
    --accent:#4CC27A; --accent-soft:#15342A; --accent-ink:#06210F; --ok:#5FD08C; --bad:#F0786B; --bad-soft:#3B1F1C; --wm-l:none; --wm-d:block; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0D1620; --surface:#15212C; --surface-2:#1B2935; --ink:#E6EDF2; --muted:#93A3B0; --line:#2A3A48;
  --accent:#4CC27A; --accent-soft:#15342A; --accent-ink:#06210F; --ok:#5FD08C; --bad:#F0786B; --bad-soft:#3B1F1C; --wm-l:none; --wm-d:block; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wm{height:22px;width:auto}.wm-l{display:var(--wm-l)}.wm-d{display:var(--wm-d)}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.05rem}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,button{font:inherit;font-size:16px;border-radius:12px;min-height:44px}
input{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 12px;flex:1;min-width:0}
button{border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
.kpi .t{font-size:.78rem;color:var(--muted);font-weight:600}
.note{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.chart svg{display:block;width:100%;height:auto}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th[aria-sort="ascending"]::after{content:" ▲"}th[aria-sort="descending"]::after{content:" ▼"}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ok);white-space:nowrap}
.pill.off{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.84rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row"><img class="wm wm-l" src="wordmark-light.png" alt="VitaPartner AI"><img class="wm wm-d" src="wordmark-dark.png" alt="VitaPartner AI"></div>
    <span class="eyebrow">Seguimiento de usuarios</span>
  </header>

  <form class="card row" id="keyForm">
    <input id="key" type="password" autocomplete="current-password" placeholder="Clave de administración" aria-label="Clave de administración">
    <button type="submit" id="loadBtn">Ver usuarios</button>
  </form>
  <div id="msg" class="note" hidden></div>

  <section id="data" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between"><div><h1 id="total">0 usuarios</h1><div class="small muted" id="upd"></div></div><button class="ghost" id="csvBtn" type="button">Descargar CSV</button></div>
    <div class="kpis" id="kpis"></div>
    <div class="card"><h2>Altas por semana</h2><div class="small muted" style="margin-bottom:8px">Últimas 12 semanas</div><div class="chart" id="chart"></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between"><h2>Usuarios</h2><input id="q" type="search" placeholder="Buscar por nombre o mail" style="max-width:320px" aria-label="Buscar"></div>
      <div class="tbl"><table><thead><tr>
        <th data-k="nombre">Nombre</th><th data-k="email">Mail</th><th data-k="alta" aria-sort="descending">Alta</th><th data-k="ultima_visita">Última visita</th><th data-k="visitas">Visitas</th><th data-k="verificado">Mail</th><th data-k="estado">Estado</th>
      </tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </section>
</div>
